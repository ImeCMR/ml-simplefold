# configs/finetune.yaml

# This is a top-level configuration for fine-tuning jobs.
# It sets the basic defaults, and all experiment-specific details
# will be provided via command-line overrides.

defaults:
  - /data: pdb
  - /model: simplefold
  - /trainer: fsdp
  - /paths: default
  - /extras: default
  - /hydra: default
  - _self_

# A generic task name that will be overridden from the command line.
task_name: "finetuning_run"

seed: 42
